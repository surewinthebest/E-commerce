name: CD - Deploy Staging App

on:
  push:
    tags:
      - 'staging-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (ios, android, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android

jobs:
  deploy-staging:
    name: Build & Deploy Staging App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Build & Auto-Submit Staging App
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          if [ -z "$PLATFORM" ]; then PLATFORM="all"; fi

          eas build \
            --platform $PLATFORM \
            --profile staging \
            --auto-submit \
            --non-interactive